<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="War Balloon" />
<meta name="theme-color" content="#2b1d16" />
<meta name="description" content="War Balloon — a hand-inked arcade adventure. The world has fallen apart. Jerry is still flying." />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./icon-180.png" />
<title>War Balloon</title>
<style>
  :root { --sat: env(safe-area-inset-top, 0px); --sar: env(safe-area-inset-right, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); }
  html, body { margin: 0; padding: 0; height: 100%; background: #2b1d16; overflow: hidden; overscroll-behavior: none; }
  body { position: fixed; inset: 0; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #safe { position: absolute; top: var(--sat); right: var(--sar); bottom: var(--sab); left: var(--sal); pointer-events: none; visibility: hidden; }
  #boot { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #f1dfb8; font: 22px/1.2 Georgia, serif; letter-spacing: 2px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="safe"></div>
<div id="boot">WARMING THE BURNER…</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
